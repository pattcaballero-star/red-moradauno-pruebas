<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red MoradaUno · Chat con el asesor</title>
<style>
:root{--g:#0b6b5c;--g2:#d9fdd3;--bg:#efeae2;--t:#1e1a22;--p:#772583}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t);background:#d9d6dc}
button{font:inherit;cursor:pointer;border:0}
.wa{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg)}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--g);color:#fff}
.bar .back{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:none;color:#fff}
.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#cfd8dc;color:#37474f;font-weight:700}
.who b{display:block;font-size:16px;line-height:1.2}.who small{font-size:12px;opacity:.85}
.chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.day{align-self:center;padding:4px 12px;border-radius:8px;background:#fff;font-size:12px;color:#54656f;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.note{align-self:center;max-width:320px;padding:8px 12px;border-radius:8px;background:#fff6cf;font-size:12.5px;line-height:1.4;text-align:center;color:#54532f}
.msg{align-self:flex-end;max-width:82%;padding:8px 10px 6px;border-radius:10px 10px 2px 10px;background:var(--g2);font-size:15px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.msg small{display:block;margin-top:2px;text-align:right;font-size:11px;color:#667781}
.compose{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;background:#f0f2f5}
.compose textarea{flex:1;min-height:96px;max-height:160px;padding:11px 14px;border:0;border-radius:22px;outline:0;resize:none;background:#fff;font:inherit;font-size:15px;line-height:1.35}
.send{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:var(--g);color:#fff}
.send svg{width:20px;height:20px;fill:#fff}
.send:disabled{opacity:.5}
.ret{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -6px 16px rgba(51,2,72,.08)}
.ret button{width:100%;height:50px;border-radius:10px;background:linear-gradient(135deg,#4a0f5e 0%,var(--p) 60%);color:#fff;font-size:16px;font-weight:700}
.ret button:focus-visible,.send:focus-visible,.back:focus-visible{outline:2px solid var(--p);outline-offset:2px}
</style>
<script src="js/config.js?v=1"></script>
<script src="js/test-mode.js?v=5"></script>
</head>
<body>
<div class="wa">
  <header class="bar">
    <button class="back" type="button" id="back1" aria-label="Volver a la app"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="av" id="av">MO</span>
    <div class="who"><b id="nm">Mariana Ortega</b><small>en línea</small></div>
  </header>
  <main class="chat" id="chat">
    <span class="day">Hoy</span>
    <p class="note">Pantalla de ejemplo. Así se abriría el chat con el mensaje ya escrito para que lo envíes al asesor.</p>
  </main>
  <form class="compose" id="form">
    <textarea id="txt" rows="4" aria-label="Mensaje"></textarea>
    <button class="send" type="submit" id="send" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M3 20.5l18-8.5L3 3.5v6.6l12 1.9-12 1.9z"/></svg></button>
  </form>
  <div class="ret"><button type="button" id="back2">Volver a la app</button></div>
</div>
<script>
(() => {
  const $ = (i) => document.getElementById(i);
  let d = {}; try { d = JSON.parse(sessionStorage.getItem('m1_wa') || '{}'); } catch (e) { d = {}; }
  const name = d.name || 'Mariana Ortega', first = name.split(' ')[0];
  $('nm').textContent = name; $('av').textContent = d.ini || name.split(' ').map((w) => w[0]).join('').slice(0, 2);
  $('txt').value = 'Hola ' + first + ', vi tu perfil en RedMoradaUno y tengo un cliente interesado en uno de tus inmuebles. ¿Podemos platicar para colaborar?';
  const back = () => { if (document.referrer && history.length > 1) history.back(); else location.href = 'ficha.html'; };
  $('back1').addEventListener('click', back); $('back2').addEventListener('click', back);
  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('txt').value.trim(); if (!v) return;
    const m = document.createElement('div'); m.className = 'msg';
    m.appendChild(document.createTextNode(v));
    const t = document.createElement('small'); t.textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); m.appendChild(t);
    $('chat').appendChild(m); $('txt').value = ''; $('chat').scrollTop = 1e6;
  });
})();
</script>
</body>
</html>
